[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascart"
version = "0.1.0"
description = "A learning project for converting images to ASCII art."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=13.0.0"]

[project.scripts]
ascart = "ascart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
